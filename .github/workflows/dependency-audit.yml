name: Dependency security audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    name: OSV dependency scan (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Resolve the exact dependency graph used by this CI run. The generated
      # pubspec.lock is temporary until the project intentionally commits one.
      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"

      - name: Install pinned OSV-Scanner
        # сеть до proxy.golang.org иногда обрывается — повторяем, прежде чем считать проверку проваленной
        run: |
          for i in 1 2 3 4; do
            go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.3 && exit 0
            echo "Попытка $i не удалась, повтор через $((i * 15)) с"
            sleep $((i * 15))
          done
          exit 1

      - name: Scan resolved dependencies
        run: |
          "$(go env GOPATH)/bin/osv-scanner" scan source -r .
