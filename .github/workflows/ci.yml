name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Анализ и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Системная библиотека SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter --version

      - name: Зависимости
        run: flutter pub get

      - name: Анализ кода
        run: flutter analyze --no-fatal-infos

      - name: Тесты
        run: flutter test --reporter expanded --coverage

      - name: Отчёт о покрытии
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Сборка APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Создать Android-проект, если его нет
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.example --project-name life_os .
          fi

      - name: Поднять minSdk до 26 (требует плагин health)
        run: |
          f=android/app/build.gradle.kts
          if [ -f "$f" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' "$f"
          else
            f=android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/' "$f"
          fi
          grep -n "minSdk" "$f"

      - name: Собрать все плагины под compileSdk 36
        run: |
          if [ -f android/build.gradle.kts ]; then
            cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              val fixSdk: Project.() -> Unit = {
                  if (name != "app") {
                      val ext = extensions.findByName("android")
                      if (ext != null) {
                          ext.javaClass.getMethod("setCompileSdkVersion", Int::class.javaPrimitiveType).invoke(ext, 36)
                      }
                  }
              }
              if (state.executed) fixSdk() else afterEvaluate { fixSdk() }
          }
          EOF
          else
            cat >> android/build.gradle <<'EOF'

          subprojects {
              afterEvaluate { p ->
                  if (p.name != 'app' && p.hasProperty('android')) {
                      p.android.compileSdkVersion 36
                  }
              }
          }
          EOF
          fi
          tail -15 android/build.gradle* | head -30

      - run: flutter pub get

      - name: Сборка release APK
        run: flutter build apk --release

      - name: APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: life-os-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
