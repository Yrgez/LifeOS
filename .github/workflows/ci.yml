name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Анализ и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Системная библиотека SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter --version

      - name: Зависимости
        run: flutter pub get

      - name: Анализ кода
        run: flutter analyze --no-fatal-infos

      - name: Тесты
        run: flutter test --reporter expanded --coverage

      - name: Отчёт о покрытии
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Сборка APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # номер сборки = число коммитов

      # Java 21: lint плагинов на новом Android Gradle Plugin (file_selector_android) использует API Java 21
      # (List.removeLast) и на JDK 17 падает в lintVitalAnalyzeRelease
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Android-проект хранится в репозитории (android/): идентификатор, разрешения, тема, правила R8 — см. docs/RELEASE.md
      - name: Версия сборки
        id: ver
        run: |
          name=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          build=$(git rev-list --count HEAD)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Версия $name, сборка $build, коммит $GITHUB_SHA"

      # Ключ подписи — из секретов репозитория (docs/RELEASE.md). Без них (форки, ключ ещё не заведён) —
      # отладочная подпись: такой APK не обновит установленную версию.
      - name: Ключ подписи
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.LIFEOS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lifeos.jks"
            echo "path=$RUNNER_TEMP/lifeos.jks" >> "$GITHUB_OUTPUT"
            echo "Подпись: ключ LIFE OS"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::Секрет LIFEOS_KEYSTORE_BASE64 не задан — APK подписан отладочным ключом и не обновит установленную версию (docs/RELEASE.md)"
          fi

      - name: Сборка release APK
        env:
          LIFEOS_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          LIFEOS_KEYSTORE_PASSWORD: ${{ secrets.LIFEOS_KEYSTORE_PASSWORD }}
          LIFEOS_KEY_ALIAS: ${{ secrets.LIFEOS_KEY_ALIAS }}
          LIFEOS_KEY_PASSWORD: ${{ secrets.LIFEOS_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name=${{ steps.ver.outputs.name }} \
            --build-number=${{ steps.ver.outputs.build }} \
            --dart-define=LIFEOS_VERSION=${{ steps.ver.outputs.name }} \
            --dart-define=LIFEOS_BUILD=${{ steps.ver.outputs.build }} \
            --dart-define=LIFEOS_COMMIT=${{ github.sha }}
          mv build/app/outputs/flutter-apk/app-release.apk "life-os-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.build }}.apk"

      - name: Проверка APK
        shell: bash -eo pipefail {0}
        run: |
          apk=life-os-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.build }}.apk
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$aapt" dump badging "$apk" | grep -E "^package:|sdkVersion|uses-permission" | tee badging.txt
          grep -q "name='io.github.yrgez.lifeos'" badging.txt
          grep -q "versionCode='${{ steps.ver.outputs.build }}'" badging.txt
          grep -q "android.permission.USE_BIOMETRIC" badging.txt
          grep -q "android.permission.health.READ_STEPS" badging.txt
          if grep -q "android.permission.INTERNET" badging.txt; then echo "::error::В APK есть разрешение INTERNET"; exit 1; fi
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$signer" verify --print-certs "$apk" 2>&1 | tee certs.txt
          # отпечаток сертификата — в сводку: у всех сборок с вашим ключом он одинаковый
          grep -E "certificate (DN|SHA-256 digest)" certs.txt >> "$GITHUB_STEP_SUMMARY"

      - name: APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: life-os-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.build }}
          path: life-os-*.apk
          if-no-files-found: error
          retention-days: 14
