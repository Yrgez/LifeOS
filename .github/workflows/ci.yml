name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Анализ и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Системная библиотека SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter --version

      - name: Зависимости
        run: flutter pub get

      - name: Анализ кода
        run: flutter analyze --no-fatal-infos

      - name: Тесты
        run: flutter test --reporter expanded --coverage

      - name: Отчёт о покрытии
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Сборка APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Создать Android-проект, если его нет
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.example --project-name life_os .
          fi

      - name: Поднять minSdk до 26 (требует плагин health)
        run: |
          f=android/app/build.gradle.kts
          if [ -f "$f" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' "$f"
          else
            f=android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/' "$f"
          fi
          grep -n "minSdk" "$f"

      - name: Собрать все плагины под compileSdk 36
        run: |
          if [ -f android/build.gradle.kts ]; then
            cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              val fixSdk: Project.() -> Unit = {
                  if (name != "app") {
                      val ext = extensions.findByName("android")
                      if (ext != null) {
                          ext.javaClass.getMethod("setCompileSdkVersion", Int::class.javaPrimitiveType).invoke(ext, 36)
                      }
                  }
              }
              if (state.executed) fixSdk() else afterEvaluate { fixSdk() }
          }
          EOF
          else
            cat >> android/build.gradle <<'EOF'

          subprojects {
              afterEvaluate { p ->
                  if (p.name != 'app' && p.hasProperty('android')) {
                      p.android.compileSdkVersion 36
                  }
              }
          }
          EOF
          fi

      - name: Настроить Health Connect (разрешения и MainActivity)
        run: |
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          if 'health.READ_STEPS' not in s:
              perms = (
                  '    <uses-permission android:name="android.permission.health.READ_STEPS"/>\n'
                  '    <uses-permission android:name="android.permission.health.READ_ACTIVE_CALORIES_BURNED"/>\n'
                  '    <uses-permission android:name="android.permission.health.READ_NUTRITION"/>\n'
                  '    <queries>\n'
                  '        <package android:name="com.google.android.apps.healthdata"/>\n'
                  '    </queries>\n'
              )
              s = s.replace('<application', perms + '    <application', 1)
              extra = (
                  '    <intent-filter>\n'
                  '                <action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE"/>\n'
                  '            </intent-filter>\n'
                  '        </activity>\n'
                  '        <activity-alias android:name="ViewPermissionUsageActivity" android:exported="true" '
                  'android:targetActivity=".MainActivity" android:permission="android.permission.START_VIEW_PERMISSION_USAGE">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.VIEW_PERMISSION_USAGE"/>\n'
                  '                <category android:name="android.intent.category.HEALTH_PERMISSIONS"/>\n'
                  '            </intent-filter>\n'
                  '        </activity-alias>'
              )
              s = s.replace('</activity>', extra, 1)
              open(p, 'w', encoding='utf-8').write(s)
          EOF
          f=$(find android/app/src/main -name 'MainActivity.*' | head -1)
          sed -i 's/FlutterActivity/FlutterFragmentActivity/g' "$f"
          echo "--- $f"; cat "$f"
          echo "--- manifest"; cat android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Сборка release APK
        run: flutter build apk --release

      - name: APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: life-os-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
