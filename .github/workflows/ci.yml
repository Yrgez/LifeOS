name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # ручной запуск кнопкой «Run workflow» во вкладке Actions

# Новый запуск отменяет предыдущий для той же ветки.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Если pubspec.yaml лежит НЕ в корне репозитория, а в подпапке (например, life_os),
# раскомментируйте и укажите её. Тогда же поправьте пути в upload-artifact ниже.
# defaults:
#   run:
#     working-directory: life_os

jobs:
  test:
    name: Анализ и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          # Когда всё заработает, зафиксируйте точную версию для воспроизводимости, например:
          # flutter-version: '3.35.0'

      # Тесты базы идут через sqflite_common_ffi и ищут системную libsqlite3.so.
      - name: Системная библиотека SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter --version

      - name: Зависимости
        run: flutter pub get

      - name: Анализ кода
        # --no-fatal-infos: подсказки линтера не валят сборку, ошибки и предупреждения — валят
        run: flutter analyze --no-fatal-infos

      - name: Тесты
        run: flutter test --reporter expanded --coverage

      - name: Отчёт о покрытии
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Сборка APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Проверка наличия Android-проекта
        run: |
          if [ ! -d android ]; then
            echo "::error::Нет папки android/. Создайте её один раз: flutter create --platforms=android --org com.example --project-name life_os . — и закоммитьте (см. объяснение)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Release-сборка с шаблонными настройками Flutter подписывается отладочным ключом — APK ставится на телефон.
      # Для публикации в Google Play нужна собственная подпись (см. объяснение).
      - name: Сборка release APK
        run: flutter build apk --release

      - name: APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: life-os-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
