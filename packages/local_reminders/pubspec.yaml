name: local_reminders
description: Локальные напоминания Catenna (Android) — расписание будильниками, показ уведомлений, восстановление после перезагрузки.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.lifeos.local_reminders
        pluginClass: LocalRemindersPlugin
