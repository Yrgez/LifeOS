name: backup_folder
description: Папка для резервных копий Catenna (Android, Storage Access Framework) — выбрать папку один раз, писать и перечислять файлы.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.lifeos.backup_folder
        pluginClass: BackupFolderPlugin
